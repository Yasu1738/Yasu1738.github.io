name: Update Inazawa Hub Data

on:
  schedule:
    # 06:00 JST = 21:00 UTC (previous day)
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_inazawa_data.py'
      - 'sources.json'
      - 'inazawa-tsunagaru/latest/template.html'
      - '.github/workflows/update-inazawa-data.yml'

permissions:
  contents: write

concurrency:
  group: inazawa-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      # Build and validate the complete static page before replacing public files.
      - name: Fetch official sources and generate static HTML
        run: python scripts/update_inazawa_data.py

      - name: Validate generated page
        run: python scripts/update_inazawa_data.py --validate-only

      - name: Commit the daily check result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- inazawa-tsunagaru/data/ inazawa-tsunagaru/latest/index.html; then
            echo "No generated-file changes. Nothing to commit."
            exit 0
          fi
          git config user.name "inazawa-auto-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inazawa-tsunagaru/data/ inazawa-tsunagaru/latest/index.html
          git commit -m "Refresh Inazawa official information and static latest page"
          git push
