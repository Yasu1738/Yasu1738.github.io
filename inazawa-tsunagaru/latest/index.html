<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最新情報｜稲沢つながる広場</title>
<style>
:root{--navy:#173d70;--blue:#2868c7;--ink:#172235;--muted:#687588;--line:#e4eaf1;--soft:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:var(--ink);line-height:1.7}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}header{padding:22px 0;border-bottom:1px solid var(--line)}header a{color:var(--navy);font-weight:900;text-decoration:none}.hero{padding:54px 0 30px;background:linear-gradient(180deg,#edf7ff,#fff)}h1{font-size:clamp(34px,6vw,58px);line-height:1.15;color:var(--navy);margin:0 0 14px}.lead{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:28px 0 60px}.panel{border:1px solid var(--line);border-radius:18px;padding:22px}.panel h2{color:var(--navy);margin:0}.meta{font-size:12px;color:var(--muted);margin:4px 0 12px}.item{padding:11px 0;border-top:1px solid #edf1f5}.item a{color:#30435f;font-weight:800;text-decoration:none}.source{margin-top:14px;font-size:13px}.source a{color:var(--blue);font-weight:800}.note{padding:14px;border-radius:12px;background:var(--soft);font-size:13px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><a href="../">← 稲沢つながる広場</a></div></header>
<section class="hero"><div class="wrap"><h1>稲沢市公式の最新情報</h1><p class="lead">毎日6:00 JSTに公式サイトを確認し、前回から内容が変わった場合だけデータを更新します。</p><p class="note">このページは公式情報への入口です。申請条件・募集期限・開催可否などは必ずリンク先の稲沢市公式ページで確認してください。</p></div></section>
<main class="wrap grid"><section class="panel"><h2>イベント</h2><div class="meta" id="events-meta">読み込み中</div><div id="events"></div><div class="source"><a href="https://www.city.inazawa.aichi.jp/category/4-7-0-0-0-0-0-0-0-0.html">稲沢市公式「イベント」 ↗</a></div></section><section class="panel"><h2>経営支援</h2><div class="meta" id="business-meta">読み込み中</div><div id="business"></div><div class="source"><a href="https://www.city.inazawa.aichi.jp/category/6-2-0-0-0-0-0-0-0-0.html">稲沢市公式「企業支援」 ↗</a></div></section></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=iso=>{if(!iso)return '初回取得待ち';try{return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))+' 更新';}catch{return iso;}};
async function load(path,id,meta){try{const r=await fetch(path,{cache:'no-store'});const d=await r.json();document.getElementById(meta).textContent=fmt(d.last_changed_at);const items=(d.items||[]).slice(0,15);document.getElementById(id).innerHTML=items.length?items.map(x=>`<div class="item"><a href="${esc(x.url)}">${esc(x.title)} ↗</a></div>`).join(''):'<div class="note">初回取得待ちです。</div>';}catch(e){document.getElementById(id).innerHTML='<div class="note">自動取得データを読み込めませんでした。</div>';}}
load('../data/events.json','events','events-meta');load('../data/business-support.json','business','business-meta');
</script>
</body>
</html>
