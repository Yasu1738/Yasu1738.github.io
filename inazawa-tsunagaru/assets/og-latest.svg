<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">稲沢市の最新情報まとめ</title><desc id="desc">稲沢つながる広場が毎朝6時に稲沢市公式サイトを確認し、イベントと経営支援を整理する非公式まとめページ</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#dff1e4"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect x="72" y="64" width="1056" height="502" rx="38" fill="#fff" stroke="#dfe6ef" stroke-width="3"/>
<text x="120" y="145" fill="#2868c7" font-family="sans-serif" font-size="32" font-weight="700">稲沢つながる広場</text>
<text x="120" y="255" fill="#173d70" font-family="sans-serif" font-size="68" font-weight="800">稲沢市の最新情報まとめ</text>
<text x="120" y="330" fill="#526175" font-family="sans-serif" font-size="38" font-weight="700">イベント・経営支援</text>
<line x1="120" y1="382" x2="1080" y2="382" stroke="#dfe6ef" stroke-width="3"/>
<text x="120" y="445" fill="#172235" font-family="sans-serif" font-size="29">毎朝6時に公式サイトを確認／公式リンク・確認日時を明示</text>
<rect x="120" y="482" width="240" height="52" rx="26" fill="#173d70"/><text x="240" y="518" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="25" font-weight="700">非公式まとめ</text>
</svg>
